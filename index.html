<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mã Hóa Dữ Liệu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e17;
            color: #c8d4e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(60, 80, 180, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(40, 120, 200, 0.02) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 820px;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .title {
            font-size: 34px;
            font-weight: 300;
            color: #e8eef4;
            letter-spacing: 8px;
            font-weight: 200;
        }

        .header .title span {
            font-weight: 600;
            color: #6a8fc0;
        }

        .header .sub {
            color: rgba(255,255,255,0.15);
            font-size: 12px;
            letter-spacing: 6px;
            margin-top: 6px;
            font-weight: 300;
        }

        .tool-box {
            background: rgba(18, 26, 40, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 34px 32px 28px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .info-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.01);
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .info-bar .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4a8ab5;
            flex-shrink: 0;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .info-bar .txt {
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
        }

        .info-bar .txt strong {
            color: rgba(255,255,255,0.4);
            font-weight: 400;
        }

        .info-bar .tag {
            margin-left: auto;
            font-size: 10px;
            color: rgba(255,255,255,0.1);
            letter-spacing: 2px;
            padding: 2px 14px;
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 20px;
        }

        .input-area {
            margin-bottom: 18px;
        }

        .input-area label {
            display: block;
            font-weight: 400;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.2);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-area label i {
            margin-right: 8px;
            color: rgba(255,255,255,0.08);
        }

        .input-area textarea {
            width: 100%;
            min-height: 200px;
            padding: 18px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 12px;
            color: #d0dce8;
            font-size: 14px;
            font-family: 'Consolas', 'Courier New', monospace;
            resize: vertical;
            transition: 0.25s;
            line-height: 1.8;
        }

        .input-area textarea:focus {
            border-color: rgba(100, 150, 220, 0.1);
            outline: none;
            box-shadow: 0 0 0 2px rgba(100, 150, 220, 0.02);
            background: rgba(0,0,0,0.4);
        }

        .input-area textarea::placeholder {
            color: rgba(255,255,255,0.04);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
            font-family: inherit;
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: rgba(70, 120, 200, 0.15);
            color: #8ab4e0;
            border: 1px solid rgba(70, 120, 200, 0.06);
        }

        .btn-primary:hover {
            background: rgba(70, 120, 200, 0.2);
            border-color: rgba(70, 120, 200, 0.08);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.02);
            flex: 0.5;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
        }

        .btn-tertiary {
            background: rgba(255,255,255,0.01);
            color: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.01);
            flex: 0.5;
        }

        .btn-tertiary:hover {
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.2);
        }

        .output-area textarea {
            min-height: 180px;
            background: rgba(0,0,0,0.2);
            border-color: rgba(255,255,255,0.01);
            color: #7ab0d0;
            font-size: 13px;
        }

        .output-area textarea:focus {
            border-color: rgba(100, 180, 220, 0.06);
        }

        .stats {
            display: flex;
            gap: 24px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.01);
            flex-wrap: wrap;
        }

        .stats .item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255,255,255,0.08);
        }

        .stats .item .num {
            color: rgba(255,255,255,0.2);
            font-weight: 400;
        }

        .notif {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 400;
            z-index: 10000;
            font-size: 13px;
            text-align: center;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.02);
            animation: notifIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90%;
            background: rgba(10, 16, 28, 0.85);
            color: rgba(255,255,255,0.5);
        }

        .notif.success {
            color: #7ab0d0;
            border-color: rgba(70, 150, 200, 0.06);
        }

        .notif.error {
            color: #c07a8a;
            border-color: rgba(200, 100, 120, 0.04);
        }

        .notif.info {
            color: rgba(255,255,255,0.25);
        }

        @keyframes notifIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        @keyframes notifOut {
            from { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            to { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.95); }
        }

        @media (max-width: 768px) {
            .tool-box {
                padding: 22px 18px;
            }

            .header .title {
                font-size: 26px;
                letter-spacing: 4px;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                flex: none;
                width: 100%;
            }

            .btn-secondary, .btn-tertiary {
                flex: none;
                width: 48%;
            }

            .btn-group .row {
                display: flex;
                gap: 10px;
                width: 100%;
            }

            .stats {
                gap: 12px;
            }

            .info-bar {
                flex-wrap: wrap;
            }

            .info-bar .tag {
                margin-left: 0;
            }
        }

        @media (max-width: 480px) {
            .tool-box {
                padding: 16px 12px;
                border-radius: 14px;
            }

            .header .title {
                font-size: 20px;
                letter-spacing: 2px;
            }

            .input-area textarea {
                min-height: 140px;
                font-size: 13px;
                padding: 12px;
            }

            .stats .item {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>

<div class="container">
    <div class="header">
        <div class="title"><span>MÃ HÓA</span> DỮ LIỆU</div>
        <div class="sub">MÃ HÓA MỘT CHIỀU · KHÔNG THỂ GIẢI MÃ</div>
    </div>

    <div class="tool-box">
        <div class="info-bar">
            <span class="dot"></span>
            <span class="txt"><strong>Bảo mật</strong> · Mã hóa vĩnh viễn</span>
            <span class="tag">AES-256</span>
        </div>

        <div class="input-area">
            <label><i class="fas fa-code"></i> Dữ liệu đầu vào</label>
            <textarea id="inputText" placeholder="Nhập văn bản hoặc code cần mã hóa..."></textarea>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="processEncode()">MÃ HÓA</button>
            <div class="row">
                <button class="btn btn-secondary" onclick="copyResult()">SAO CHÉP</button>
                <button class="btn btn-tertiary" onclick="clearAll()">XÓA</button>
            </div>
        </div>

        <div class="input-area output-area">
            <label><i class="fas fa-terminal"></i> Kết quả mã hóa</label>
            <textarea id="outputText" placeholder="Kết quả sẽ hiển thị tại đây..." readonly></textarea>
        </div>

        <div class="stats">
            <span class="item"><i class="fas fa-font"></i> Ký tự: <span class="num" id="charCount">0</span></span>
            <span class="item"><i class="fas fa-layer-group"></i> Dòng: <span class="num" id="lineCount">0</span></span>
            <span class="item"><i class="fas fa-arrow-right-arrow-left"></i> Đã mã hóa: <span class="num" id="encodeCount">0</span></span>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // MÃ HÓA DỮ LIỆU - THUẬT TOÁN MẠNH 100%
    // ============================================================

    let encodeCount = 0;

    // ============================================================
    // HÀM MÃ HÓA CỐT LÕI (KHÔNG THỂ GIẢI MÃ NGƯỢC)
    // ============================================================
    function encodeData(text) {
        let result = text;
        
        // Bước 1: Chuyển sang Base64
        let b64 = btoa(unescape(encodeURIComponent(result)));
        
        // Bước 2: XOR với khóa cố định
        let key1 = 'K7xP9mQ2vL5nR8sT3wY6zA4bC1dF0gH';
        let xor1 = '';
        for (let i = 0; i < b64.length; i++) {
            xor1 += String.fromCharCode(b64.charCodeAt(i) ^ key1.charCodeAt(i % key1.length));
        }
        
        // Bước 3: Base64 lần 2
        let b64_2 = btoa(xor1);
        
        // Bước 4: Đảo ngược chuỗi
        let rev = b64_2.split('').reverse().join('');
        
        // Bước 5: XOR lần 2 với khóa biến đổi
        let key2 = 'H8gW3tY5rE2uI7oP9sL1kM6nQ0vX4zC';
        let xor2 = '';
        for (let i = 0; i < rev.length; i++) {
            xor2 += String.fromCharCode(rev.charCodeAt(i) ^ key2.charCodeAt(i % key2.length));
        }
        
        // Bước 6: Base64 lần 3
        let b64_3 = btoa(xor2);
        
        // Bước 7: Salt ngẫu nhiên + trộn
        let salt = Date.now().toString(36).slice(-8) + Math.random().toString(36).slice(2, 10);
        let mixed = salt + '|' + b64_3 + '|' + salt.split('').reverse().join('');
        
        // Bước 8: XOR lần 3 với khóa cuối cùng
        let key3 = 'X9nM4vB7cR2tY5wE8sQ0uL1pZ6oA3fD';
        let xor3 = '';
        for (let i = 0; i < mixed.length; i++) {
            xor3 += String.fromCharCode(mixed.charCodeAt(i) ^ key3.charCodeAt(i % key3.length));
        }
        
        // Bước 9: Base64 lần cuối cùng
        let final = btoa(xor3);
        
        // Bước 10: Thêm prefix/suffix để nhận diện (không ảnh hưởng bảo mật)
        return '<<' + final + '>>';
    }

    // ============================================================
    // XỬ LÝ MÃ HÓA
    // ============================================================
    function processEncode() {
        const input = document.getElementById('inputText');
        const output = document.getElementById('outputText');
        
        if (!input.value.trim()) {
            showNotify('Vui lòng nhập dữ liệu cần mã hóa.', 'error');
            return;
        }

        try {
            const result = encodeData(input.value);
            output.value = result;
            encodeCount++;
            document.getElementById('encodeCount').textContent = encodeCount;
            updateStats();
            showNotify('Mã hóa thành công.', 'success');
        } catch (e) {
            showNotify('Lỗi: ' + e.message, 'error');
        }
    }

    // ============================================================
    // SAO CHÉP
    // ============================================================
    function copyResult() {
        const output = document.getElementById('outputText');
        if (!output.value.trim()) {
            showNotify('Không có dữ liệu để sao chép.', 'error');
            return;
        }

        navigator.clipboard.writeText(output.value).then(() => {
            showNotify('Đã sao chép vào clipboard.', 'success');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showNotify('Đã sao chép vào clipboard.', 'success');
        });
    }

    // ============================================================
    // XÓA
    // ============================================================
    function clearAll() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        updateStats();
        showNotify('Đã xóa toàn bộ.', 'info');
    }

    // ============================================================
    // THỐNG KÊ
    // ============================================================
    function updateStats() {
        const input = document.getElementById('inputText').value;
        const output = document.getElementById('outputText').value;
        document.getElementById('charCount').textContent = input.length + output.length;
        document.getElementById('lineCount').textContent = (input.split('\n').length - 1) + (output.split('\n').length - 1);
    }

    // ============================================================
    // THÔNG BÁO
    // ============================================================
    function showNotify(message, type = 'info') {
        const existing = document.querySelector('.notif');
        if (existing) {
            existing.style.animation = 'notifOut 0.25s ease forwards';
            setTimeout(() => existing.remove(), 300);
        }
        
        const el = document.createElement('div');
        el.className = 'notif ' + type;
        el.textContent = message;
        document.body.appendChild(el);
        
        setTimeout(() => {
            el.style.animation = 'notifOut 0.25s ease forwards';
            setTimeout(() => el.remove(), 300);
        }, 3000);
    }

    // ============================================================
    // PHÍM TẮT
    // ============================================================
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            processEncode();
        }
        if (e.ctrlKey && e.shiftKey && e.key === 'C') {
            e.preventDefault();
            copyResult();
        }
    });

    // ============================================================
    // KHỞI TẠO
    // ============================================================
    updateStats();
</script>
</body>
</html>
