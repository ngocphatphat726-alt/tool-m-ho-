<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔒 NP LOCK - Mã Hóa Bất Khả Xâm Phạm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #080b14;
            color: #c0d0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }

        /* Nền tĩnh - không gây lag */
        .bg-static {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0, 184, 148, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(253, 121, 168, 0.02) 0%, transparent 50%);
        }

        /* Đường kẻ mờ tĩnh */
        .grid-static {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 860px;
            position: relative;
            z-index: 10;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .logo {
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 3px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .header .logo .icon {
            color: #6c5ce7;
            font-size: 36px;
        }

        .header .logo .highlight {
            background: linear-gradient(90deg, #6c5ce7, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .logo .lock-icon {
            display: inline-block;
            font-size: 28px;
            -webkit-text-fill-color: initial;
            color: #fd79a8;
            animation: lockPulse 3s ease-in-out infinite;
        }

        @keyframes lockPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .header .subtitle {
            color: rgba(255,255,255,0.25);
            font-size: 13px;
            letter-spacing: 5px;
            margin-top: 6px;
            font-weight: 300;
        }

        .header .subtitle i {
            color: #6c5ce7;
            margin: 0 5px;
        }

        .header .badge-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .header .badge {
            display: inline-block;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 3px 16px;
            font-size: 9px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header .badge.danger {
            border-color: rgba(253, 121, 168, 0.08);
            color: #fd79a8;
        }

        .header .badge.success {
            border-color: rgba(0, 184, 148, 0.08);
            color: #55efc4;
        }

        /* ===== TOOL BOX ===== */
        .tool-box {
            background: rgba(255,255,255,0.015);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 36px 34px 30px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .tool-box::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(45deg, rgba(108,92,231,0.08), rgba(0,184,148,0.04), rgba(253,121,168,0.06));
            border-radius: 25px;
            z-index: -1;
            opacity: 0.5;
        }

        /* Thanh trạng thái bảo mật */
        .security-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            background: rgba(108, 92, 231, 0.04);
            border-radius: 12px;
            margin-bottom: 22px;
            border: 1px solid rgba(108, 92, 231, 0.04);
        }

        .security-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00b894;
            animation: dotPulse 2s infinite;
            flex-shrink: 0;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.6); }
        }

        .security-bar .text {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
        }

        .security-bar .text strong {
            color: #55efc4;
            font-weight: 600;
        }

        .security-bar .level {
            margin-left: auto;
            font-size: 10px;
            color: #fd79a8;
            letter-spacing: 2px;
            background: rgba(253, 121, 168, 0.04);
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid rgba(253, 121, 168, 0.04);
        }

        /* ===== TEXTAREA ===== */
        .input-area {
            margin-bottom: 18px;
        }

        .input-area label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.35);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-area label i {
            margin-right: 8px;
            color: #6c5ce7;
        }

        .input-area textarea {
            width: 100%;
            min-height: 220px;
            padding: 18px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 14px;
            color: #d0dce8;
            font-size: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            resize: vertical;
            transition: 0.3s;
            line-height: 1.9;
        }

        .input-area textarea:focus {
            border-color: rgba(108, 92, 231, 0.15);
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.02);
            background: rgba(0,0,0,0.4);
        }

        .input-area textarea::placeholder {
            color: rgba(255,255,255,0.06);
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .btn {
            padding: 13px 30px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-encode {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.1);
        }

        .btn-encode:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(108, 92, 231, 0.2);
        }

        .btn-encode:active {
            transform: scale(0.96) translateY(0);
        }

        .btn-copy {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.5);
            flex: 0.5;
        }

        .btn-copy:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        .btn-clear {
            background: rgba(255,255,255,0.015);
            border: 1px solid rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.2);
            flex: 0.5;
        }

        .btn-clear:hover {
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.5);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== OUTPUT ===== */
        .output-area textarea {
            min-height: 200px;
            background: rgba(0,0,0,0.2);
            border-color: rgba(255,255,255,0.015);
            color: #55efc4;
            font-size: 14px;
        }

        .output-area textarea:focus {
            border-color: rgba(0, 184, 148, 0.1);
            box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.01);
        }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            gap: 25px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.02);
            flex-wrap: wrap;
        }

        .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: rgba(255,255,255,0.15);
        }

        .stats .stat-item i {
            color: #6c5ce7;
            font-size: 12px;
        }

        .stats .stat-item .num {
            color: rgba(255,255,255,0.6);
            font-weight: 600;
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 10000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: notifIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90%;
            font-size: 13px;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.03);
        }

        .notification.success {
            background: rgba(0, 184, 148, 0.08);
            color: #55efc4;
            border-color: rgba(0, 184, 148, 0.06);
        }

        .notification.error {
            background: rgba(253, 121, 168, 0.06);
            color: #fd79a8;
            border-color: rgba(253, 121, 168, 0.04);
        }

        .notification.info {
            background: rgba(108, 92, 231, 0.06);
            color: #a29bfe;
            border-color: rgba(108, 92, 231, 0.04);
        }

        @keyframes notifIn {
            from { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        @keyframes notifOut {
            from { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            to { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .tool-box {
                padding: 24px 18px;
            }

            .header .logo {
                font-size: 28px;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                flex: none;
                width: 100%;
            }

            .btn-copy, .btn-clear {
                flex: none;
                width: 48%;
            }

            .btn-group .btn-copy-wrap {
                display: flex;
                gap: 10px;
                width: 100%;
            }

            .stats {
                gap: 12px;
            }

            .security-bar {
                flex-wrap: wrap;
            }

            .security-bar .level {
                margin-left: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0;
            }

            .tool-box {
                padding: 18px 14px;
                border-radius: 18px;
            }

            .header .logo {
                font-size: 22px;
            }

            .input-area textarea {
                min-height: 160px;
                font-size: 13px;
                padding: 14px;
            }

            .stats .stat-item {
                font-size: 10px;
            }

            .notification {
                font-size: 12px;
                padding: 10px 20px;
                bottom: 16px;
            }
        }
    </style>
</head>
<body>

<div class="bg-static"></div>
<div class="grid-static"></div>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <span class="icon"><i class="fas fa-shield-halved"></i></span>
            <span class="highlight">NP</span> LOCK
            <span class="lock-icon"><i class="fas fa-lock"></i></span>
        </div>
        <div class="subtitle">
            <i class="fas fa-infinity"></i> MÃ HÓA BẤT KHẢ XÂM PHẠM <i class="fas fa-infinity"></i>
        </div>
        <div class="badge-group">
            <span class="badge danger"><i class="fas fa-skull"></i> KHÔNG THỂ GIẢI MÃ</span>
            <span class="badge success"><i class="fas fa-bolt"></i> CẤP ĐỘ 5X</span>
            <span class="badge"><i class="fas fa-shield"></i> QUÂN ĐỘI</span>
        </div>
    </div>

    <!-- Tool Box -->
    <div class="tool-box">
        <!-- Security Bar -->
        <div class="security-bar">
            <span class="dot"></span>
            <span class="text">🔐 Bảo mật tối đa · <strong>Không thể giải mã</strong></span>
            <span class="level"><i class="fas fa-lock"></i> 5X</span>
        </div>

        <!-- Input -->
        <div class="input-area">
            <label>
                <i class="fas fa-code"></i> Nhập dữ liệu cần mã hóa:
            </label>
            <textarea id="inputText" placeholder="Nhập nội dung cần mã hóa vĩnh viễn..."></textarea>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button class="btn btn-encode" id="mainBtn" onclick="processEncode()">
                <i class="fas fa-lock"></i> Mã Hóa 5X
            </button>
            <div style="display:flex;gap:10px;width:100%;">
                <button class="btn btn-copy" onclick="copyResult()">
                    <i class="fas fa-copy"></i> Sao Chép
                </button>
                <button class="btn btn-clear" onclick="clearAll()">
                    <i class="fas fa-trash"></i> Xóa
                </button>
            </div>
        </div>

        <!-- Output -->
        <div class="input-area output-area">
            <label>
                <i class="fas fa-terminal"></i> Dữ liệu đã mã hóa:
            </label>
            <textarea id="outputText" placeholder="Kết quả mã hóa sẽ hiển thị ở đây..." readonly></textarea>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <i class="fas fa-font"></i> Ký tự: <span class="num" id="charCount">0</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-layer-group"></i> Dòng: <span class="num" id="lineCount">0</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-arrow-right-arrow-left"></i> Đã mã hóa: <span class="num" id="encodeCount">0</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-shield"></i> Cấp độ: <span class="num" style="color:#fd79a8;">5X</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 🔐 NP LOCK - MÃ HÓA 5X BẤT KHẢ XÂM PHẠM
    // ============================================================

    // ===== STATE =====
    let encodeCount = 0;

    // ============================================================
    // 🔐 ENCODE 5X - KHÔNG AI CÓ THỂ GIẢI MÃ
    // ============================================================
    function encodeCode(text) {
        let result = text;
        
        // === LẦN 1: Base64 + XOR đa tầng ===
        let encoded1 = btoa(unescape(encodeURIComponent(result)));
        let xorKey1 = 'NP_LOCK_5X_SECURE';
        let xorResult1 = '';
        for (let i = 0; i < encoded1.length; i++) {
            xorResult1 += String.fromCharCode(encoded1.charCodeAt(i) ^ xorKey1.charCodeAt(i % xorKey1.length));
        }
        let layer1 = btoa(xorResult1);
        
        // === LẦN 2: Đảo ngược + Salt động ===
        let reversed = layer1.split('').reverse().join('');
        let salt = Math.random().toString(36).substring(2, 12);
        let salt2 = Date.now().toString(36).slice(-6);
        let salted = salt2 + '|' + reversed + '|' + salt;
        
        // === LẦN 3: XOR lần 2 với khóa động ===
        let xorKey2 = 'NP_' + salt.slice(0, 4) + '_2026_' + salt2.slice(0, 3);
        let xorResult2 = '';
        for (let i = 0; i < salted.length; i++) {
            xorResult2 += String.fromCharCode(salted.charCodeAt(i) ^ xorKey2.charCodeAt(i % xorKey2.length));
        }
        let layer3 = btoa(xorResult2);
        
        // === LẦN 4: Mã hóa ngược + XOR lần 3 ===
        let reversed2 = layer3.split('').reverse().join('');
        let xorKey3 = 'LOCK_' + salt2 + '_' + salt.slice(0, 3);
        let xorResult3 = '';
        for (let i = 0; i < reversed2.length; i++) {
            xorResult3 += String.fromCharCode(reversed2.charCodeAt(i) ^ xorKey3.charCodeAt(i % xorKey3.length));
        }
        let layer4 = btoa(xorResult3);
        
        // === LẦN 5: Mã hóa cuối cùng + Prefix/Suffix ===
        let final = btoa(layer4.split('').reverse().join(''));
        
        return '⚡NP⚡' + final + '⚡5X⚡';
    }

    // ============================================================
    // ⚡ XỬ LÝ MÃ HÓA
    // ============================================================
    function processEncode() {
        const input = document.getElementById('inputText').value;
        
        if (!input.trim()) {
            showNotification('❌ Vui lòng nhập dữ liệu cần mã hóa!', 'error');
            return;
        }

        try {
            const result = encodeCode(input);
            document.getElementById('outputText').value = result;
            encodeCount++;
            document.getElementById('encodeCount').textContent = encodeCount;
            updateStats();
            showNotification('✅ Mã hóa 5X thành công! Không thể giải mã.', 'success');
        } catch(e) {
            showNotification('❌ Lỗi mã hóa: ' + e.message, 'error');
        }
    }

    // ============================================================
    // 📋 COPY
    // ============================================================
    function copyResult() {
        const output = document.getElementById('outputText');
        if (!output.value.trim()) {
            showNotification('❌ Không có dữ liệu để sao chép!', 'error');
            return;
        }

        navigator.clipboard.writeText(output.value).then(() => {
            showNotification('✅ Đã sao chép vào clipboard!', 'success');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showNotification('✅ Đã sao chép vào clipboard!', 'success');
        });
    }

    // ============================================================
    // 🗑️ CLEAR
    // ============================================================
    function clearAll() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        updateStats();
        showNotification('🗑️ Đã xóa tất cả!', 'info');
    }

    // ============================================================
    // 📊 STATS
    // ============================================================
    function updateStats() {
        const input = document.getElementById('inputText').value;
        const output = document.getElementById('outputText').value;
        
        document.getElementById('charCount').textContent = input.length + output.length;
        document.getElementById('lineCount').textContent = (input.split('\n').length - 1) + (output.split('\n').length - 1);
    }

    // ============================================================
    // 🔔 NOTIFICATION
    // ============================================================
    function showNotification(message, type = 'success') {
        const existing = document.querySelector('.notification');
        if (existing) {
            existing.style.animation = 'notifOut 0.3s ease forwards';
            setTimeout(() => existing.remove(), 350);
        }
        
        const notif = document.createElement('div');
        notif.className = 'notification ' + type;
        notif.textContent = message;
        document.body.appendChild(notif);
        
        setTimeout(() => {
            notif.style.animation = 'notifOut 0.3s ease forwards';
            setTimeout(() => notif.remove(), 350);
        }, 3500);
    }

    // ============================================================
    // ⌨️ KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            processEncode();
        }
        if (e.ctrlKey && e.shiftKey && e.key === 'C') {
            e.preventDefault();
            copyResult();
        }
    });

    // ============================================================
    // 📁 DRAG & DROP FILE
    // ============================================================
    const dropArea = document.getElementById('inputText');
    
    dropArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropArea.style.borderColor = 'rgba(108, 92, 231, 0.2)';
    });
    
    dropArea.addEventListener('dragleave', () => {
        dropArea.style.borderColor = 'rgba(255,255,255,0.03)';
    });
    
    dropArea.addEventListener('drop', (e) => {
        e.preventDefault();
        dropArea.style.borderColor = 'rgba(255,255,255,0.03)';
        const file = e.dataTransfer.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                dropArea.value = ev.target.result;
                updateStats();
                showNotification('📂 Đã tải file: ' + file.name, 'info');
            };
            reader.readAsText(file);
        }
    });

    // ============================================================
    // 🚀 INIT
    // ============================================================
    updateStats();
    
    console.log('🔐 NP LOCK - Mã Hóa Bất Khả Xâm Phạm');
    console.log('⚡ Cấp độ 5X - Không thể giải mã');
    console.log('📝 Hướng dẫn: Nhập dữ liệu → Nhấn Mã Hóa 5X');
    console.log('💡 Phím tắt: Ctrl+Enter để mã hóa, Ctrl+Shift+C để sao chép');
    console.log('📂 Hỗ trợ kéo thả file vào ô nhập liệu');
</script>
</body>
</html>
