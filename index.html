<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NP MÃ HOÁ - Mã Hóa & Giải Mã Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2e, #1a0a3e, #0d1b2a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== FALLING EFFECTS ===== */
        #falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .falling-item {
            position: absolute;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
            opacity: 0.4;
            user-select: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0.6;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 920px;
            position: relative;
            z-index: 10;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .logo {
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
        }

        .header .logo i {
            -webkit-text-fill-color: initial;
            color: #ffd93d;
            margin-right: 10px;
        }

        .header .logo::after {
            content: '⚡';
            position: absolute;
            right: -40px;
            top: -10px;
            font-size: 24px;
            -webkit-text-fill-color: initial;
            color: #ffd93d;
            animation: spark 1.5s infinite;
        }

        @keyframes spark {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
        }

        .header .subtitle {
            color: rgba(255,255,255,0.4);
            font-size: 15px;
            letter-spacing: 5px;
            margin-top: 5px;
        }

        .header .subtitle i {
            color: #ff6b6b;
            margin: 0 5px;
        }

        .header .version {
            display: inline-block;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 2px 14px;
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
            margin-top: 8px;
        }

        /* ===== TOOL BOX ===== */
        .tool-box {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .tool-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #a855f7, #ff6b6b);
            border-radius: 26px;
            z-index: -1;
            background-size: 400% 400%;
            animation: gradientBorder 6s ease infinite;
        }

        @keyframes gradientBorder {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 30px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 12px;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .tab-btn:hover {
            border-color: rgba(255,255,255,0.08);
            color: #fff;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, rgba(255,107,107,0.15), rgba(77,150,255,0.15));
            border-color: #4d96ff;
            color: #fff;
            box-shadow: 0 0 40px rgba(77,150,255,0.03);
        }

        .tab-btn i {
            margin-right: 8px;
        }

        /* ===== TEXTAREA ===== */
        .input-area {
            margin-bottom: 20px;
        }

        .input-area label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .input-area label i {
            margin-right: 8px;
            color: #4d96ff;
        }

        .input-area textarea {
            width: 100%;
            min-height: 200px;
            padding: 18px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            resize: vertical;
            transition: 0.3s;
            line-height: 1.8;
        }

        .input-area textarea:focus {
            border-color: #4d96ff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(77,150,255,0.03);
            background: rgba(255,255,255,0.04);
        }

        .input-area textarea::placeholder {
            color: rgba(255,255,255,0.12);
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            opacity: 0;
            transition: 0.5s;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn-encode {
            background: linear-gradient(135deg, #4d96ff, #6bcb77);
            color: #fff;
            box-shadow: 0 4px 20px rgba(77,150,255,0.15);
        }

        .btn-encode:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(77,150,255,0.25);
        }

        .btn-decode {
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255,107,107,0.15);
        }

        .btn-decode:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255,107,107,0.25);
        }

        .btn-copy {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
        }

        .btn-copy:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-3px);
        }

        .btn-clear {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.3);
        }

        .btn-clear:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== OUTPUT ===== */
        .output-area {
            position: relative;
        }

        .output-area textarea {
            min-height: 200px;
            background: rgba(0,0,0,0.25);
            border-color: rgba(255,255,255,0.02);
            color: #6bcb77;
        }

        .output-area textarea:focus {
            border-color: #6bcb77;
            box-shadow: 0 0 0 4px rgba(107,203,119,0.03);
        }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            gap: 30px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.03);
            flex-wrap: wrap;
        }

        .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }

        .stats .stat-item i {
            color: #4d96ff;
        }

        .stats .stat-item .num {
            color: #fff;
            font-weight: 600;
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 10000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideIn 0.5s ease;
            max-width: 420px;
            font-size: 14px;
        }

        .notification.success {
            background: linear-gradient(135deg, #6bcb77, #2d7d46);
            color: #fff;
        }

        .notification.error {
            background: linear-gradient(135deg, #ff6b6b, #cc3333);
            color: #fff;
        }

        .notification.info {
            background: linear-gradient(135deg, #4d96ff, #1a4a8a);
            color: #fff;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* ===== ENCRYPTION LEVEL ===== */
        .level-badge {
            display: inline-block;
            background: rgba(255,215,0,0.06);
            border: 1px solid rgba(255,215,0,0.08);
            border-radius: 20px;
            padding: 2px 16px;
            font-size: 10px;
            color: #ffd93d;
            letter-spacing: 1px;
            margin-left: 10px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .tool-box {
                padding: 25px 20px;
            }

            .header .logo {
                font-size: 32px;
            }

            .tabs {
                flex-direction: column;
            }

            .tab-btn {
                flex: none;
                text-align: center;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                justify-content: center;
            }

            .stats {
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .tool-box {
                padding: 20px 15px;
                border-radius: 16px;
            }

            .header .logo {
                font-size: 26px;
            }

            .input-area textarea {
                min-height: 150px;
                font-size: 13px;
            }

            .stats {
                flex-direction: column;
                gap: 8px;
            }

            .notification {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<!-- ===== FALLING EFFECTS ===== -->
<div id="falling-container"></div>

<!-- ===== NOTIFICATION ===== -->
<div id="notification"></div>

<!-- ===== MAIN CONTAINER ===== -->
<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <i class="fas fa-shield-halved"></i> THAILE PRO
        </div>
        <div class="subtitle">
            <i class="fas fa-lock"></i> MÃ HÓA & GIẢI MÃ CODE <i class="fas fa-unlock"></i>
            <span class="level-badge"><i class="fas fa-bolt"></i> CẤP ĐỘ 3X</span>
        </div>
        <div class="version">v3.0 · BẢO MẬT NÂNG CAO</div>
    </div>

    <!-- Tool Box -->
    <div class="tool-box">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="encode" onclick="switchTab('encode')">
                <i class="fas fa-lock"></i> Mã Hóa
            </button>
            <button class="tab-btn" data-tab="decode" onclick="switchTab('decode')">
                <i class="fas fa-unlock"></i> Giải Mã
            </button>
        </div>

        <!-- Input -->
        <div class="input-area">
            <label id="inputLabel">
                <i class="fas fa-code"></i> Nhập code cần xử lý:
            </label>
            <textarea id="inputText" placeholder="Nhập code vào đây..."></textarea>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button class="btn btn-encode" id="mainBtn" onclick="processCode()">
                <i class="fas fa-lock"></i> Mã Hóa
            </button>
            <button class="btn btn-decode" id="secondaryBtn" onclick="processCode()" style="display:none;">
                <i class="fas fa-unlock"></i> Giải Mã
            </button>
            <button class="btn btn-copy" onclick="copyResult()">
                <i class="fas fa-copy"></i> Sao Chép
            </button>
            <button class="btn btn-clear" onclick="clearAll()">
                <i class="fas fa-trash"></i> Xóa
            </button>
        </div>

        <!-- Output -->
        <div class="input-area output-area">
            <label>
                <i class="fas fa-terminal"></i> Kết quả:
            </label>
            <textarea id="outputText" placeholder="Kết quả sẽ hiển thị ở đây..." readonly></textarea>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <i class="fas fa-font"></i> Ký tự: <span class="num" id="charCount">0</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-layer-group"></i> Dòng: <span class="num" id="lineCount">0</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-arrow-right-arrow-left"></i> Mã hóa: <span class="num" id="encodeCount">0</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-arrow-left-arrow-right"></i> Giải mã: <span class="num" id="decodeCount">0</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-shield"></i> Bảo mật: <span class="num" style="color:#ffd93d;">3X</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 🔐 THAILE PRO - MÃ HÓA & GIẢI MÃ CẤP ĐỘ 3X
    // ============================================================

    // ===== FALLING EFFECTS =====
    const emojis = ['🔒', '🔑', '⚡', '💻', '🛡️', '🔐', '⚙️', '🔧', '📀', '💾', '🖥️', '⌨️', '🖱️', '📱', '💡', '🌟', '✨', '🎯', '🔥', '🌀', '⚡'];
    
    function createFallingItem() {
        const container = document.getElementById('falling-container');
        const el = document.createElement('div');
        el.className = 'falling-item';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.fontSize = (18 + Math.random() * 28) + 'px';
        el.style.animationDuration = (10 + Math.random() * 18) + 's';
        el.style.animationDelay = (Math.random() * 4) + 's';
        container.appendChild(el);
        
        setTimeout(() => {
            el.remove();
        }, 30000);
    }

    setInterval(createFallingItem, 350);
    for (let i = 0; i < 20; i++) {
        setTimeout(createFallingItem, i * 200);
    }

    // ===== STATE =====
    let currentTab = 'encode';
    let encodeCount = 0;
    let decodeCount = 0;

    // ===== TAB SWITCH =====
    function switchTab(tab) {
        currentTab = tab;
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

        const inputLabel = document.getElementById('inputLabel');
        const mainBtn = document.getElementById('mainBtn');
        const secondaryBtn = document.getElementById('secondaryBtn');

        if (tab === 'encode') {
            inputLabel.innerHTML = '<i class="fas fa-code"></i> Nhập code cần mã hóa:';
            mainBtn.style.display = 'inline-flex';
            mainBtn.innerHTML = '<i class="fas fa-lock"></i> Mã Hóa 3X';
            secondaryBtn.style.display = 'none';
            document.getElementById('outputText').placeholder = 'Kết quả mã hóa sẽ hiển thị ở đây...';
        } else {
            inputLabel.innerHTML = '<i class="fas fa-lock"></i> Nhập code đã mã hóa:';
            mainBtn.style.display = 'none';
            secondaryBtn.style.display = 'inline-flex';
            secondaryBtn.innerHTML = '<i class="fas fa-unlock"></i> Giải Mã 3X';
            document.getElementById('outputText').placeholder = 'Kết quả giải mã sẽ hiển thị ở đây...';
        }
        
        document.getElementById('outputText').value = '';
    }

    // ============================================================
    // 🔐 ENCODE 3X - MÃ HÓA CẤP ĐỘ 3 LẦN
    // ============================================================
    function encodeCode(text) {
        let result = text;
        
        // === LẦN 1: Base64 + XOR ===
        let encoded1 = btoa(unescape(encodeURIComponent(result)));
        let xorKey1 = 'THAILE_PRO_3X';
        let xorResult1 = '';
        for (let i = 0; i < encoded1.length; i++) {
            xorResult1 += String.fromCharCode(encoded1.charCodeAt(i) ^ xorKey1.charCodeAt(i % xorKey1.length));
        }
        let base64Xor1 = btoa(xorResult1);
        
        // === LẦN 2: Đảo ngược + Salt ===
        let reversed = base64Xor1.split('').reverse().join('');
        let salt = Math.random().toString(36).substring(2, 10);
        let salted = salt + '|' + reversed + '|' + salt.split('').reverse().join('');
        
        // === LẦN 3: XOR lần 2 + Prefix/Suffix ===
        let xorKey2 = 'THL_ELH_2026';
        let xorResult2 = '';
        for (let i = 0; i < salted.length; i++) {
            xorResult2 += String.fromCharCode(salted.charCodeAt(i) ^ xorKey2.charCodeAt(i % xorKey2.length));
        }
        let final = btoa(xorResult2);
        
        // Thêm prefix/suffix đặc trưng
        return '⚡THL⚡' + final + '⚡ELH⚡';
    }

    // ============================================================
    // 🔓 DECODE 3X - GIẢI MÃ CẤP ĐỘ 3 LẦN
    // ============================================================
    function decodeCode(text) {
        try {
            let result = text.trim();
            
            // Xóa prefix/suffix
            if (result.startsWith('⚡THL⚡') && result.endsWith('⚡ELH⚡')) {
                result = result.slice(7, -7);
            }
            
            // === GIẢI LẦN 3: Base64 decode + XOR lần 2 ===
            let decoded3 = atob(result);
            let xorKey2 = 'THL_ELH_2026';
            let xorResult2 = '';
            for (let i = 0; i < decoded3.length; i++) {
                xorResult2 += String.fromCharCode(decoded3.charCodeAt(i) ^ xorKey2.charCodeAt(i % xorKey2.length));
            }
            
            // === GIẢI LẦN 2: Bỏ salt + đảo ngược ===
            let parts = xorResult2.split('|');
            if (parts.length < 3) throw new Error('Dữ liệu không hợp lệ');
            let reversed = parts[1];
            let unsalted = reversed.split('').reverse().join('');
            
            // === GIẢI LẦN 1: Base64 decode + XOR lần 1 ===
            let decoded1 = atob(unsalted);
            let xorKey1 = 'THAILE_PRO_3X';
            let xorResult1 = '';
            for (let i = 0; i < decoded1.length; i++) {
                xorResult1 += String.fromCharCode(decoded1.charCodeAt(i) ^ xorKey1.charCodeAt(i % xorKey1.length));
            }
            let final = decodeURIComponent(escape(atob(xorResult1)));
            
            return final;
        } catch (e) {
            return null;
        }
    }

    // ============================================================
    // ⚡ XỬ LÝ CHÍNH
    // ============================================================
    function processCode() {
        const input = document.getElementById('inputText').value;
        
        if (!input.trim()) {
            showNotification('❌ Vui lòng nhập code cần xử lý!', 'error');
            return;
        }

        let result;
        let isSuccess = true;
        let message = '';

        if (currentTab === 'encode') {
            result = encodeCode(input);
            encodeCount++;
            document.getElementById('encodeCount').textContent = encodeCount;
            message = '✅ Mã hóa 3X thành công!';
        } else {
            result = decodeCode(input);
            if (result === null) {
                showNotification('❌ Không thể giải mã! Kiểm tra lại code.', 'error');
                return;
            }
            decodeCount++;
            document.getElementById('decodeCount').textContent = decodeCount;
            message = '✅ Giải mã 3X thành công!';
        }

        document.getElementById('outputText').value = result;
        showNotification(message, 'success');
        updateStats();
    }

    // ============================================================
    // 📋 COPY
    // ============================================================
    function copyResult() {
        const output = document.getElementById('outputText');
        if (!output.value.trim()) {
            showNotification('❌ Không có gì để sao chép!', 'error');
            return;
        }

        navigator.clipboard.writeText(output.value).then(() => {
            showNotification('✅ Đã sao chép vào clipboard!', 'success');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showNotification('✅ Đã sao chép vào clipboard!', 'success');
        });
    }

    // ============================================================
    // 🗑️ CLEAR
    // ============================================================
    function clearAll() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        updateStats();
        showNotification('🗑️ Đã xóa tất cả!', 'info');
    }

    // ============================================================
    // 📊 STATS
    // ============================================================
    function updateStats() {
        const input = document.getElementById('inputText').value;
        const output = document.getElementById('outputText').value;
        
        document.getElementById('charCount').textContent = input.length + output.length;
        document.getElementById('lineCount').textContent = (input.split('\n').length - 1) + (output.split('\n').length - 1);
    }

    // ============================================================
    // 🔔 NOTIFICATION
    // ============================================================
    function showNotification(message, type = 'success') {
        const notif = document.getElementById('notification');
        notif.textContent = message;
        notif.className = 'notification ' + type;
        notif.style.display = 'block';
        
        clearTimeout(notif._timeout);
        notif._timeout = setTimeout(() => {
            notif.style.animation = 'slideOut 0.5s ease forwards';
            setTimeout(() => {
                notif.style.display = 'none';
                notif.style.animation = '';
            }, 500);
        }, 3500);
    }

    // ============================================================
    // ⌨️ KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            processCode();
        }
        if (e.ctrlKey && e.shiftKey && e.key === 'C') {
            e.preventDefault();
            copyResult();
        }
    });

    // ============================================================
    // 🔍 AUTO DETECT
    // ============================================================
    function autoDetect() {
        const input = document.getElementById('inputText').value;
        if (input.startsWith('⚡THL⚡') && input.endsWith('⚡ELH⚡')) {
            if (currentTab === 'encode') {
                switchTab('decode');
                showNotification('🔍 Phát hiện code đã mã hóa! Chuyển sang chế độ giải mã 3X.', 'info');
            }
        }
    }

    let detectTimeout;
    document.getElementById('inputText').addEventListener('input', () => {
        clearTimeout(detectTimeout);
        detectTimeout = setTimeout(autoDetect, 500);
        updateStats();
    });

    // ============================================================
    // 🚀 INIT
    // ============================================================
    updateStats();

    // Tất cả thuật toán đều được tối ưu hóa bằng tay
    // ============================================================
    
    console.log('🛡️ THAILE PRO - Mã Hóa & Giải Mã 3X');
    console.log('📝 Hướng dẫn:');
    console.log('  1. Chọn tab Mã Hóa hoặc Giải Mã');
    console.log('  2. Nhập code vào ô trên');
    console.log('  3. Nhấn Enter hoặc nút tương ứng');
    console.log('  4. Kết quả hiển thị ở ô dưới');
    console.log('💡 Phím tắt: Ctrl+Enter để xử lý, Ctrl+Shift+C để sao chép');
    console.log('⚡ Cấp độ bảo mật: 3X (gấp 3 lần so với bản thường)');
